apply plugin: 'com.android.application'

android {
    namespace 'com.example.util'
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.example.util"
        minSdkVersion 23
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        androidPlatform {
            keyAlias 'signedtest'
            keyPassword 'signedtest'
            storeFile file('../keystores/signedtest.jks')
            storePassword 'signedtest'
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.androidPlatform
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.androidPlatform
        }
    }
    compileOptions {
    lint {
        abortOnError false
    }
        sourceCompatibility JavaVersion.VERSION_1_8
    lint {
        abortOnError false
    }
        targetCompatibility JavaVersion.VERSION_1_8
    lint {
        abortOnError false
    }
    }
    lint {
        abortOnError false
    }

}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    //noinspection GradleCompatible
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    implementation 'com.squareup.okhttp3:okhttp:4.6.0'
    implementation 'com.google.code.gson:gson:2.8.5'
    //glide
    implementation "com.github.bumptech.glide:glide:4.8.0"
    //fresco
    implementation 'com.facebook.fresco:fresco:0.14.0'
    //gson
    implementation 'com.google.code.gson:gson:2.8.6'
}
