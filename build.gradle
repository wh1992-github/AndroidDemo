//Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext.kotlin_version = '1.8.22'
    ext {
        agp_version = '7.4.2'
    }
    repositories {
        // 添加阿里云 maven 地址
        // 阿里云聚合公共仓库，一个顶多个
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/google' }
        // 官方兜底（放后面）
        google()
        mavenCentral()
        // jitpack放最后，github源码打包aar才用到
        maven { url "https://jitpack.io" }
    }
    dependencies {
        //下面的版本号就是Android Studio的版本号
        classpath "com.android.tools.build:gradle:$agp_version"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
    tasks.withType(JavaCompile) {//解决编码错误: 编码UTF-8的不可映射字
        options.encoding = "UTF-8"
    }
}

allprojects {
    repositories {
        // 添加阿里云 maven 地址
        // 阿里云聚合公共仓库，一个顶多个
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/google' }
        // 官方兜底（放后面）
        google()
        mavenCentral()
        // jitpack放最后，github源码打包aar才用到
        maven { url "https://jitpack.io" }
    }

    configurations.all {
        resolutionStrategy {
            force "androidx.lifecycle:lifecycle-livedata-core:2.6.2"
            force "androidx.lifecycle:lifecycle-runtime-ktx:2.6.2"
            force "androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2"
            force "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
            force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
            force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
            force "org.jetbrains.kotlin:kotlin-stdlib-common:$kotlin_version"
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
